  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:__gateB(__gateP.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:__gateB(__gateP.i)},key,__gateB(__gateP.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  try{ await __gateOpen(document.getElementById('pw').value.trim()); }
  catch(_){ err.textContent='Код не подошел'; }
});
</script>
